{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
   <div class="col">
      <div class="card mb-4 rounded-3 shadow-sm">
         <div class="card-header py-3">
            <h4 class="my-0 fw-normal">{{ context['additional_data'].name }}</h4>
         </div>
         <div class="card-body">
            <h1 class="card-title pricing-card-title">{{ context['additional_data'].price }}<small class="text-body-secondary fw-light">/руб.</small></h1>
           <p>{{ context['additional_data'].description }}</p>
            <button type="button" class="w-100 btn btn-lg btn-outline-primary">Купить</button>
         </div>
      </div>
   </div>
</div>
{% endblock %}
