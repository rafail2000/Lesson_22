{% extends 'base.html' %}

{% block content %}
<div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
  {% for product in products %}
   <div class="col">
      <div class="card mb-4 rounded-3 shadow-sm">
         <div class="card-header py-3">
            <h4 class="my-0 fw-normal">{{ product.name }}</h4>
         </div>
         <div class="card-body">
            <h1 class="card-title pricing-card-title">{{ product.price }}<small class="text-body-secondary fw-light">/руб.</small></h1>
           <p>{{ product.description|truncatechars:100 }}</p>
            <!-- ССЫЛКА С КЛАССАМИ КНОПКИ -->
            <a href="{% url 'catalog:product_item' product.id %}"
               class="w-100 btn btn-lg btn-outline-primary">
               Подробнее
            </a>
         </div>
      </div>
   </div>
  {% endfor %}
</div>
{% endblock %}
