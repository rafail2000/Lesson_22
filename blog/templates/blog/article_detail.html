{% extends 'blog/base.html' %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
   <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
         <div class="col">
            <div class="card shadow-sm">
               <img src="{{ blog.photo }}">
               <div class="card_body">
                  <p class="card-text">Название статьи: {{ object.title }}</p>
                  <p class="card-text">Описание статьи: {{ object.content }}</p>
                  <p class="card-text">Дата создания статьи: {{ object.created_at }}</p>
                  <div class="d-flex justify-content-between align-items-center">
                     <div class="btn-group">
                        <a class="btn btn-primary" href="{% url 'blog:articles_list' %}" role="button">Назад</a>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
{% endblock %}
